<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1a2e" />
    <title>Spiritwood</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #03070d; overflow: hidden; }
      body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #d8f3ff; }
      #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #game canvas { display: block; outline: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; letter-spacing: 0.3em;
        text-transform: uppercase; font-size: 13px; color: #7fb6c8; transition: opacity 0.6s; pointer-events: none; }
      #boot.hidden { opacity: 0; }
      #boot.error { color: #ff8fa3; letter-spacing: 0.05em; text-transform: none; white-space: pre-wrap; padding: 24px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="boot">Gathering light…</div>
    <noscript>This game needs JavaScript and WebGL2.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
